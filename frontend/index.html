<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My Blogs</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <div class="container">
      <header class="page-header">
        <h1>My Blogs</h1>
        <div class="header-actions">
          <span id="currentUser" class="hidden" aria-live="polite"></span>
          <button id="logoutBtn" class="secondary-btn hidden" type="button">Log out</button>
          <button id="refreshBtn" class="secondary-btn" type="button">Refresh</button>
        </div>
      </header>

      <div id="message" class="message" aria-live="polite"></div>

      <section id="authPanel" class="form-panel auth-panel">
        <div class="auth-forms">
          <form id="loginForm">
            <h2>Log in</h2>
            <div class="field">
              <label for="loginIdentifier">Username or email</label>
              <input id="loginIdentifier" name="username" type="text" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="loginPassword">Password</label>
              <div class="password-field">
                <input id="loginPassword" name="password" type="password" autocomplete="current-password" required />
                <button class="secondary-btn password-toggle" type="button" data-toggle-password="loginPassword">Show</button>
              </div>
            </div>
            <button id="loginBtn" type="submit" class="primary-btn">Log in</button>
          </form>

          <form id="registerForm">
            <h2>Create an account</h2>
            <div class="field">
              <label for="registerName">Name</label>
              <input id="registerName" name="name" type="text" maxlength="100" autocomplete="name" required />
            </div>
            <div class="field">
              <label for="registerUsername">Username</label>
              <input id="registerUsername" name="username" type="text" minlength="3" maxlength="30" autocomplete="username" required />
            </div>
            <div class="field">
              <label for="registerEmail">Email</label>
              <input id="registerEmail" name="email" type="email" maxlength="254" autocomplete="email" required />
            </div>
            <div class="field">
              <label for="registerMobileNumber">Mobile number (optional)</label>
              <input id="registerMobileNumber" name="mobile_number" type="tel" maxlength="15" pattern="\+?[0-9]{1,15}" autocomplete="tel" inputmode="tel" title="Use digits and an optional leading + (maximum 15 characters)." />
            </div>
            <div class="field">
              <label for="registerPassword">Password (at least 12 characters)</label>
              <div class="password-field">
                <input id="registerPassword" name="password" type="password" minlength="12" maxlength="128" autocomplete="new-password" required />
                <button class="secondary-btn password-toggle" type="button" data-toggle-password="registerPassword">Show</button>
              </div>
            </div>
            <button id="registerBtn" type="submit" class="primary-btn">Register</button>
          </form>
        </div>
      </section>

      <section id="profilePanel" class="form-panel hidden" aria-labelledby="profileTitle">
        <h2 id="profileTitle">Your account</h2>
        <form id="mobileNumberForm">
          <div class="field">
            <label for="profileMobileNumber">Mobile number</label>
            <input id="profileMobileNumber" name="mobile_number" type="tel" maxlength="20" pattern="\+?[0-9]{1,20}" autocomplete="tel" inputmode="tel" title="Use digits and an optional leading + (maximum 20 characters)." />
          </div>
          <div class="form-actions">
            <button id="saveMobileNumberBtn" class="primary-btn" type="submit">Save mobile number</button>
          </div>
        </form>
      </section>

      <section id="blogFormPanel" class="form-panel hidden">
        <h2 id="formTitle">Create Blog</h2>
        <form id="blogForm">
          <input type="hidden" id="blogId" />

          <div class="form-grid">
            <div class="field">
              <label for="title">Title</label>
              <input id="title" name="title" type="text" placeholder="Enter title" required />
            </div>

            <div class="field">
              <label for="city">City</label>
              <input id="city" name="city" type="text" placeholder="Enter city" required />
            </div>

            <div class="field">
              <label for="email">Email</label>
              <input id="email" name="email" type="email" placeholder="Enter email" required />
            </div>

            <div class="field">
              <label for="author">Author</label>
              <input id="author" name="author" type="text" placeholder="Enter author" required />
            </div>
          </div>
          <div class="field full-width">
            <label for="description">Description</label>
            <textarea id="description" name="description" rows="6" placeholder="Write your blog description here..." required></textarea>
          </div>


        <div class="field full-width">
          <label>Select Tags (Optional)</label>

          <div class="tag-options">
            <label>
              <input type="checkbox" name="tags" value="1" />
              King
            </label>

            <label>
              <input type="checkbox" name="tags" value="2" />
              Queen
            </label>

            <label>
              <input type="checkbox" name="tags" value="3" />
              Son
            </label>
          </div>
        </div>


          <div class="form-actions">
            <button id="saveBlogBtn" class="primary-btn" type="submit">Save Blog</button>
            <button id="cancelEditBtn" class="secondary-btn hidden" type="button">Cancel</button>
          </div>
        </form>
      </section>

      
<section class="blogs-panel">
  <div class="section-header">
    <h2>All Blogs</h2>
  </div>

<div class="field">
  <label for="tagFilter">Filter Blogs by Tag</label>
  <select id="tagFilter">
    <option value="All">All Tags</option>
    <option value="King">King</option>
    <option value="Queen">Queen</option>
    <option value="Son">Son</option>
  </select>
</div>

<div class="field">
  <label for="userFilter">Filter Blogs by User</label>
  <select id="userFilter">
    <option value="All">All Users</option>
  </select>
</div>

  <div id="blogList" class="blog-list" aria-live="polite"></div>
</section>

    </div>

    <dialog id="blogDetailsDialog" class="details-dialog" aria-labelledby="detailsTitle">
      <div class="dialog-content">
        <header class="dialog-header">
          <h2 id="detailsTitle">Blog Details</h2>
          <button id="closeDetailsIcon" class="icon-btn" type="button" aria-label="Close blog details">&times;</button>
        </header>
        <dl id="detailsList" class="details-list"></dl>
        <div class="dialog-actions">
          <button id="detailsUpdateBtn" class="edit-btn hidden" type="button">Update</button>
          <button id="detailsDeleteBtn" class="delete-btn hidden" type="button">Delete</button>
          <button id="closeDetailsBtn" class="secondary-btn" type="button">Close</button>
        </div>
      </div>
    </dialog>

    <script src="script.js"></script>
  </body>
</html>
